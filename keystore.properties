# The release build is signed with this key so that every APK produced by GitHub Actions
# can be installed *on top of* the previous one (no uninstall needed).
#
# It is a throw-away "sideload" key that is public in this repository.
# If you ever publish to Google Play, replace it with your own upload key:
#
#   storeFile=keystore/release.jks
#   storePassword=...
#   keyAlias=...
#   keyPassword=...
#
# You can also override everything with the environment variables
# RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD.
storeFile=keystore/release.jks
storePassword=shortsgen
keyAlias=shortsgen
keyPassword=shortsgen
