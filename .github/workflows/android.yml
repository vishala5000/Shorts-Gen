name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release APKs
    runs-on: ubuntu-latest
    env:
      # every CI run gets a higher versionCode so the APK installs as an update
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make sure the Android SDK has platform 34 + build-tools 34
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "::warning::sdkmanager not found - Gradle will download what it needs"
          fi
          echo "sdk.dir=$SDK" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download offline assets (voice model, espeak-ng data, font, sherpa-onnx AAR)
        run: bash scripts/prepare_assets.sh

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect outputs
        run: |
          mkdir -p build-output
          find app/build/outputs/apk -name "*.apk" | sort
          cp app/build/outputs/apk/release/app-release.apk build-output/ShortsGen-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk    build-output/ShortsGen-debug.apk
          ls -la build-output
          echo ""
          echo "Install the release APK:"
          echo "    adb install -r build-output/ShortsGen-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShortsGen-APKs
          path: build-output/
          retention-days: 30
          if-no-files-found: error

      - name: Publish APKs to a GitHub Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
